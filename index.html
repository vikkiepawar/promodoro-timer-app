<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css"/>
  <script defer src="script.js"></script>
</head>
<body>

<div class="app">

  <h1>Pomodoro Timer</h1>

  <div class="timer pulse">
    <span id="minutes">25</span>:<span id="seconds">00</span>
  </div>

  <div class="modes">
    <button data-mode="pomodoro">Pomodoro</button>
    <button data-mode="short">Short Break</button>
    <button data-mode="long">Long Break</button>
  </div>

  <div class="controls">
    <button id="start">Start</button>
    <button id="pause">Pause</button>
    <button id="reset">Reset</button>
  </div>

  <section class="settings">
  <h3>Timer Settings</h3>

  <label>
    Pomodoro (minutes)
    <input type="number" id="pomodoro-input" value="25" min="1">
  </label>

  <label>
    Short Break (minutes)
    <input type="number" id="short-input" value="5" min="1">
  </label>

  <label>
    Long Break (minutes)
    <input type="number" id="long-input" value="15" min="1">
  </label>
  </section>


  <section class="progress">
    <h3>Productivity</h3>
    <p>Completed Pomodoros: <strong id="count">0</strong></p>

    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>

    <button id="reset-progress" class="danger">Reset Progress</button>
  </section>

</div>

</body>
</html>
